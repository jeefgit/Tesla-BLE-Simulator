<svg xmlns="http://www.w3.org/2000/svg" width="466" height="466" viewBox="0 0 466 466">
  <defs>
    <radialGradient id="black" cx="50%" cy="48%" r="66%">
      <stop stop-color="#080a0d"/>
      <stop offset=".72" stop-color="#020304"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#08090c"/>
      <stop offset=".13" stop-color="#34363d"/>
      <stop offset=".27" stop-color="#17191e"/>
      <stop offset=".5" stop-color="#090a0d"/>
      <stop offset=".73" stop-color="#1b1d22"/>
      <stop offset=".88" stop-color="#3b3d43"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4a4b51"/>
      <stop offset=".22" stop-color="#303137"/>
      <stop offset=".72" stop-color="#1b1c21"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171b20"/>
      <stop offset=".4" stop-color="#080a0d"/>
      <stop offset=".7" stop-color="#14171b"/>
      <stop offset="1" stop-color="#050608"/>

    <radialGradient id="greenGlow">
      <stop stop-color="#37f477" stop-opacity=".3"/>
      <stop offset="1" stop-color="#37f477" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="round"><circle cx="233" cy="233" r="231"/></clipPath>

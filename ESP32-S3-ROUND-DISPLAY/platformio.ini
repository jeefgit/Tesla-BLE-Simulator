[platformio]
default_envs = waveshare_esp32_s3
; 复用已编译目标文件：来回切换 build_flags 时命中旧缓存，避免每次都全量重编。
build_cache_dir = .pio/build_cache

[env:waveshare_esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

; TeslaBleBackend 位于仓库根目录（本工程的上一级）
lib_extra_dirs = ..
lib_ignore =
    TESLA-DASHBOARD
    ESP32-S3-ROUND-DISPLAY
    simulator

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    lvgl/lvgl@^9
    moononournation/GFX Library for Arduino

; 与 Waveshare ESP-IDF 示例的 CONFIG_COMPILER_OPTIMIZATION_PERF 对齐：
; LVGL 软件渲染和 Arduino_GFX 都在本工程内编译，Release 默认 -Os 偏重体积。
build_unflags = -Os
; 注意：这里的每一项改动都会触发全量重编。LVGL 的可调项已移到
; include/lv_conf.h，日常调参请改那个文件，尽量不要动这一段。
build_flags =
    -I include
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

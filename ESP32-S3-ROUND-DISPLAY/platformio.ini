[platformio]
default_envs = waveshare_esp32_s3

[env:waveshare_esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

; TeslaBleBackend 位于仓库根目录（本工程的上一级）
lib_extra_dirs = ..
lib_ignore =
    TESLA-DASHBOARD
    ESP32-S3-ROUND-DISPLAY
    simulator

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    lvgl/lvgl@^9
    moononournation/GFX Library for Arduino

build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    -DLV_MEM_SIZE=98304
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_48=1

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>Tesla 仪表 · 设计预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --text: #f5f7fb;
      --muted: #8b93a1;
      --line: rgba(195, 211, 235, .11);
      --red: #e82127;
      --cyan: #a9eaff;
      --green: #6edb9a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    body {
      min-width: 320px;
      min-height: 240px;
      background:
        radial-gradient(ellipse at 50% 54%, rgba(37, 80, 112, .19), transparent 44%),
        radial-gradient(ellipse at 50% 105%, rgba(22, 38, 61, .35), transparent 52%),
        #05070b;
    }

    .dashboard {
      width: 100%;
      height: 100%;
      min-height: 240px;
      display: grid;
      grid-template-rows: clamp(42px, 10.5vh, 68px) minmax(0, 1fr);
      padding: 0 clamp(14px, 3.2vw, 58px) clamp(10px, 2.4vh, 20px);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) auto minmax(140px, 1fr);
      align-items: center;
      gap: 12px;
      color: #d7dbe2;
      font-size: clamp(12px, 1.65vw, 22px);
      letter-spacing: .04em;
    }

    .outside {
      display: flex;
      align-items: baseline;
      gap: 12px;
      white-space: nowrap;
    }

    .outside-label { color: #a8afbb; }
    .outside-value { font-variant-numeric: tabular-nums; }

    .vehicle-state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3.2vw, 54px);
      color: #626b78;
      font-size: clamp(12px, 1.5vw, 20px);
      font-weight: 650;
    }

    .state-item {
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: .46;
    }

    .state-item.active {
      color: #f3f6fb;
      opacity: .95;
      text-shadow: 0 0 13px rgba(181, 232, 255, .36);
    }

    .lamp {
      position: relative;
      width: clamp(13px, 2vw, 24px);
      height: clamp(13px, 2vw, 24px);
      display: inline-block;
    }

    .lamp::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 8px;
      height: 12px;
      border-right: 3px solid currentColor;
      border-radius: 0 70% 70% 0;
    }

    .lamp::after {
      content: "";
      position: absolute;
      right: 0;
      top: 1px;
      width: 7px;
      height: 4px;
      border-top: 2px solid currentColor;
      box-shadow: 0 6px currentColor, 0 12px currentColor;
      opacity: .9;
    }

    .clock {
      justify-self: end;
      font-size: clamp(16px, 2vw, 27px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .11em;
      color: #f6f7fa;
    }

    .cockpit {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(105px, 19%) minmax(0, 1fr) minmax(130px, 21%);
      align-items: center;
      position: relative;
    }

    .cockpit::before {
      content: "";
      position: absolute;
      z-index: 0;
      left: 17%;
      right: 19%;
      top: 49%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(151, 221, 246, .22), transparent);
      box-shadow: 0 0 28px 8px rgba(92, 178, 212, .10);
    }

    .side-panel {
      position: relative;
      z-index: 1;
      height: 72%;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .left-panel {
      border-right: 1px solid var(--line);
      background: linear-gradient(90deg, transparent, rgba(17, 26, 42, .20));
    }

    .car {
      width: clamp(58px, 8.2vw, 116px);
      height: min(60vh, 310px);
      max-height: 70%;
      display: block;
      object-fit: contain;
      transform: scale(1.8);
      filter: drop-shadow(0 5px 16px rgba(195, 219, 242, .13));
      mix-blend-mode: screen;
    }

    .center-panel {
      z-index: 1;
      min-width: 0;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .speed-ring {
      width: min(68vh, 42vw, 520px);
      height: min(68vh, 42vw, 520px);
      min-width: 190px;
      min-height: 190px;
      max-width: 100%;
      max-height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background:
        radial-gradient(circle, #020306 0 53%, transparent 54%),
        radial-gradient(circle, rgba(160, 191, 203, .66) 0%, #35434a 12%, #172027 22%, #0a0d11 34%, transparent 39%);
      box-shadow:
        0 0 28px rgba(160, 221, 241, .14),
        inset 0 0 25px rgba(185, 225, 238, .12);
    }

    .speed-ring::before {
      content: "";
      position: absolute;
      inset: 3.5%;
      border: 1px solid rgba(214, 235, 247, .20);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(170, 223, 239, .13);
    }

    .speed-inner {
      width: 54%;
      height: 54%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -1%;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 70% 35%, rgba(48, 80, 100, .20), transparent 42%),
        radial-gradient(circle, #020306 55%, #06090e 100%);
    }

    .speed {
      font-size: clamp(48px, 9.5vh, 106px);
      font-weight: 330;
      line-height: .96;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      margin-top: 8px;
      color: #868c96;
      font-size: clamp(13px, 2.3vh, 24px);
      letter-spacing: .1em;
      font-weight: 300;
    }

    .gear {
      width: clamp(39px, 8vh, 66px);
      height: clamp(39px, 8vh, 66px);
      margin-top: clamp(12px, 3vh, 30px);
      display: grid;
      place-items: center;
      border: 1px solid rgba(116, 214, 239, .72);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #1a414c, #071014 70%);
      box-shadow: 0 0 16px rgba(90, 211, 234, .22), inset 0 0 9px rgba(119, 227, 244, .16);
      font-size: clamp(20px, 4vh, 38px);
      font-weight: 600;
    }

    .right-panel {
      border-left: 1px solid var(--line);
      background: linear-gradient(270deg, transparent, rgba(17, 26, 42, .20));
      gap: clamp(8px, 2vh, 22px);
    }

    .vehicle-outline {
      position: relative;
      width: clamp(52px, 7vw, 82px);
      height: clamp(99px, 27.2vh, 184px);
      border: 4px solid rgba(192, 194, 203, .78);
      border-top-width: 5px;
      border-bottom-width: 5px;
      border-radius: 48% / 19%;
      filter: drop-shadow(0 0 9px rgba(218, 223, 239, .08));
    }

    .vehicle-outline::before {
      content: "";
      position: absolute;
      left: 22%;
      right: 22%;
      top: 25%;
      bottom: 25%;
      border-left: 2px solid rgba(170, 173, 185, .36);
      border-right: 2px solid rgba(170, 173, 185, .36);
    }

    .tire {
      position: absolute;
      width: 12px;
      height: clamp(21px, 6vh, 40px);
      border-radius: 3px;
      background: #9799a3;
      box-shadow: 0 0 0 5px #11131a;
    }

    .tire.fl { left: -9px; top: 15%; }
    .tire.fr { right: -9px; top: 15%; }
    .tire.rl { left: -9px; bottom: 15%; }
    .tire.rr { right: -9px; bottom: 15%; }

    .tire-value {
      position: absolute;
      color: #abb0bc;
      font-size: clamp(10px, 1.35vw, 15px);
      letter-spacing: .06em;
    }

    .tire-value.fl { left: -42px; top: 19%; }
    .tire-value.fr { right: -42px; top: 19%; }
    .tire-value.rl { left: -42px; bottom: 19%; }
    .tire-value.rr { right: -42px; bottom: 19%; }

    .lock-status {
      font-size: clamp(13px, 2vw, 22px);
      font-weight: 520;
      white-space: nowrap;
    }

    .range {
      position: absolute;
      left: 6%;
      right: 1%;
      bottom: 2.5%;
      display: grid;
      grid-template-columns: auto minmax(50px, 1fr) auto;
      grid-template-rows: auto auto;
      column-gap: 12px;
      row-gap: 7px;
      align-items: center;
      color: #f5f7fb;
    }

    .battery-chip {
      width: clamp(37px, 5vw, 58px);
      height: clamp(22px, 4vh, 30px);
      display: grid;
      place-items: center;
      color: #30343b;
      background: #c1c3c9;
      border-radius: 8px;
      font-size: clamp(12px, 1.7vw, 18px);
      font-weight: 700;
    }

    .battery-track {
      height: clamp(7px, 1.5vh, 12px);
      border-radius: 99px;
      background: #292b31;
      overflow: hidden;
    }

    .battery-fill {
      width: 68%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #85d9a4, #49bc7d);
      box-shadow: 0 0 12px rgba(91, 220, 147, .3);
    }

    .range-label {
      grid-column: 1 / 3;
      color: #c6c9d0;
      font-size: clamp(12px, 1.75vw, 18px);
      letter-spacing: .07em;
    }

    .range-value {
      justify-self: end;
      font-size: clamp(13px, 1.8vw, 19px);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    @media (max-height: 420px) {
      .dashboard { grid-template-rows: 38px minmax(0, 1fr); padding-bottom: 5px; }
      .side-panel { height: 76%; min-height: 0; }
      .speed-ring { width: min(64vh, 38vw, 380px); height: min(64vh, 38vw, 380px); min-width: 0; min-height: 0; }
      .range { bottom: 1%; }
    }

    @media (max-width: 560px) {
      .dashboard { padding-left: 8px; padding-right: 8px; }
      .cockpit { grid-template-columns: minmax(62px, 17%) minmax(0, 1fr) minmax(92px, 22%); }
      .topbar { grid-template-columns: 1fr auto 1fr; gap: 4px; }
      .vehicle-state { gap: 9px; }
      .outside { gap: 6px; }
      .range { left: 3%; right: 1%; column-gap: 7px; }
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-label="特斯拉驾驶仪表设计预览">
    <header class="topbar">
      <div class="outside">
        <span class="outside-label">车外</span>
        <span class="outside-value">-- °C</span>
      </div>
      <div class="vehicle-state" aria-label="车辆灯光状态">
        <span class="state-item"><i class="lamp"></i></span>
        <span class="state-item active"><i class="lamp"></i></span>
        <span class="state-item"><i class="lamp"></i></span>
      </div>
      <time class="clock" id="clock">18:00</time>
    </header>

    <section class="cockpit">
      <aside class="side-panel left-panel" aria-label="车辆状态">
        <img class="car" src="./assets/car-top.png" alt="车辆俯视图">
      </aside>

      <div class="center-panel">
        <div class="speed-ring">
          <div class="speed-inner">
            <span class="speed">0</span>
            <span class="unit">KM/H</span>
            <span class="gear">P</span>
          </div>
        </div>
      </div>

      <aside class="side-panel right-panel" aria-label="车轮和锁状态">
        <div class="vehicle-outline">
          <span class="tire fl"></span><span class="tire fr"></span>
          <span class="tire rl"></span><span class="tire rr"></span>
          <span class="tire-value fl">--</span><span class="tire-value fr">--</span>
          <span class="tire-value rl">--</span><span class="tire-value rr">--</span>
        </div>
        <div class="lock-status">设备未连接</div>
      </aside>

      <div class="range" aria-label="预计续航">
        <span class="battery-chip">68%</span>
        <div class="battery-track"><div class="battery-fill"></div></div>
        <span class="range-label">预估可行驶里程</span>
        <span class="range-value">326 km</span>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var clock = document.getElementById('clock');
      function updateClock() {
        var now = new Date();
        clock.textContent = String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0');
      }
      updateClock();
      setInterval(updateClock, 15000);
    }());
  </script>
</body>
</html>

; ============================================================
; ESP32 BLE Tesla Dashboard — PlatformIO 工程配置
; ------------------------------------------------------------
; 构建:   pio run
; 烧录:   pio run -t upload
; 串口:   pio device monitor
; ============================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 默认分区只给 app 1.25MB flash，BLE 固件(NimBLE+LVGL+LovyanGFX) ~1.7MB 放不下。
; max_app_4MB 把整片 4MB 全给 app（无 SPIFFS/OTA），仪表不需要文件系统。
board_build.partitions = max_app_4MB.csv

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -Wall
    ; 每个函数/全局数据独立成节，链接时用 --gc-sections 丢弃未引用部分，
    ; 显著减小 flash 占用与静态 RAM（NimBLE/BLE 路径没 ms 就不进 dram0）
    -ffunction-sections
    -fdata-sections
    ; 链接时剔除未用代码/数据，缓解 dram0_0_seg 静态 RAM 溢出
    -Wl,--gc-sections
    ; LVGL 的 lv_conf.h 放在工程 include/ 下；PlatformIO 默认只把 include/ 
    ; 加给 src 编译单元，库编译看不到，必须显式 -I 才能让 lvgl 库找到配置
    -I include
    -DLV_CONF_INCLUDE_SIMPLE

; 只走特斯拉 BLE，OBD(ELM327) 协议层不参与编译（文件保留，需要时去掉 -<obd/>）
build_src_filter =
    +<*>
    -<obd/>

lib_deps =
    ; 轻量级 NimBLE 客户端库（比 Bluedroid 省 200KB+ 内存，扫描/连接更稳）
    ; 注意：必须用 2.x —— 1.x 与 Arduino core 3.x/IDF5 不兼容，
    ; 运行时会在 NimBLEDevice::init 处 esp_bt_controller_init 报 INVALID_STATE 崩溃循环
    h2zero/NimBLE-Arduino@^2.5.1
    ; 显示栈：LVGL 9 UI 框架 + LovyanGFX 驱动（ESP32 上最快的 SPI 屏库，DMA 加速）
    lvgl/lvgl@^9
    lovyan03/LovyanGFX@^1

; 换板子时复制一个 env 改 board 即可，例如:
; [env:esp32-s3]
; board = esp32-s3-devkitc-1
;
; [env:esp32-c3]
; board = esp32-c3-devkitm-1
